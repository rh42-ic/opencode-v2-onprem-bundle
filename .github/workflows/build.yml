name: build-bundle

on:
  workflow_dispatch:
    inputs:
      opencode_ref:
        description: "opencode tag/branch/commit (empty = latest v* tag)"
        required: false
        default: ""
      platform:
        description: "target platform"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - linux-x64
          - win32-x64
      skip_verify:
        description: "skip offline verification"
        required: false
        default: false
        type: boolean
      build_from_source:
        description: "build binary from source instead of official release (needed for non-tag refs)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 顺序执行：linux 先发布 body，win 轮只传资产（两者不并行，避免 Release 创建竞态）
      max-parallel: 1
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'all' && '["linux-x64","win32-x64"]' || format('["{0}"]', inputs.platform)) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve ref & install bun
        id: prep
        run: |
          REF="${{ inputs.opencode_ref }}"
          if [ -z "$REF" ]; then
            REF="$(git ls-remote --tags --refs --sort='-v:refname' https://github.com/anomalyco/opencode 'v*' | head -1 | sed 's|.*refs/tags/||')"
            [ -n "$REF" ] || { echo "no tag found" >&2; exit 1; }
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          REQUIRED="$(curl -fsSL "https://raw.githubusercontent.com/anomalyco/opencode/$REF/package.json" | grep -oP '"packageManager": *"bun@\K[^"]*')"
          echo "bun=$REQUIRED" >> "$GITHUB_OUTPUT"
          echo "ref=$REF bun=$REQUIRED"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.prep.outputs.bun }}

      - name: Build bundle (official binary default, source fallback)
        run: |
          ARGS=""
          if [ "${{ inputs.build_from_source }}" = "true" ]; then ARGS="$ARGS --from-source"; fi
          bun run scripts/build.ts --ref "${{ steps.prep.outputs.ref }}" --platform "${{ matrix.platform }}" $ARGS

      - name: Verify offline
        if: ${{ inputs.skip_verify != true }}
        run: |
          source work/build.env
          ./scripts/verify.sh "$TARBALL"

      - name: Prepare release notes
        run: |
          source work/build.env
          cp work/release-notes.md release-notes.md
          echo "version=$VERSION" >> "$GITHUB_ENV"

      # release 说明以 linux 版为主：linux 轮写入/刷新 body，其他平台轮只上传资产（不改 body/标题）
      - name: Publish release (linux body)
        if: ${{ matrix.platform == 'linux-x64' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "bundle-v${{ env.version }}"
          name: "opencode v${{ env.version }} onprem bundle"
          body_path: release-notes.md
          files: |
            out/opencode-v${{ env.version }}-onprem-bundle-${{ matrix.platform }}.*

      - name: Publish release (assets only)
        if: ${{ matrix.platform != 'linux-x64' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "bundle-v${{ env.version }}"
          files: |
            out/opencode-v${{ env.version }}-onprem-bundle-${{ matrix.platform }}.*
